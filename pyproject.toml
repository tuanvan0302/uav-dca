[project]
name = "sota"
version = "0.1.0"
description = "ST-DCA: penalty-DCA trajectory planning for a UAV avoiding dynamic obstacles, with Tier-1 baselines"
readme = "README.md"
authors = [
    { name = "tuanvan0302", email = "doantuanvan2003@gmail.com" }
]
requires-python = ">=3.12"
# Giữ đồng bộ với requirements.txt (bản ghim chính xác).
dependencies = [
    "numpy==2.5.5",
    "scipy==1.18.1",
    "cvxpy==1.9.3",
    "osqp==1.1.3",
    "clarabel==0.11.1",
]

# Code chạy trực tiếp từ thư mục code/ (python3 -m tests.<tên>), không
# đóng gói thành wheel.
[tool.uv]
package = false

# Lint và format theo AGENTS.md mục 4. Chạy từ thư mục SOTA/:
#   ruff format code && ruff check code
[tool.ruff]
line-length = 88
target-version = "py312"
src = ["code"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "D1"]
ignore = [
    # Ký hiệu toán học trùng báo cáo (K, P, O, R, RHO, T_r...) — ngoại lệ
    # có chủ đích, xem AGENTS.md mục 2 "Ký hiệu toán học".
    "N803", "N806", "N815", "E741",
    # Giữ dòng "# -*- coding: utf-8 -*-" ở file cũ (AGENTS.md mục 4).
    "UP009",
    # zip(strict=...) đổi hành vi khi độ dài lệch; chỉ thêm khi sửa logic.
    "B905",
]

[tool.ruff.lint.per-file-ignores]
# Hàm test tự mô tả qua tên; không bắt docstring cho từng hàm test.
"code/tests/*" = ["D1"]
"code/baselines/test_baselines.py" = ["D1"]
"code/**/__init__.py" = ["D104"]

[tool.ruff.lint.isort]
known-first-party = ["core", "baselines", "sim", "experiments"]
